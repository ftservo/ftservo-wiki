site_name: FEETECH Wiki
site_description: FEETECH servo selection, setup, software and SDK documentation.
site_url: https://ftservo.github.io/ftservo-wiki/
repo_name: ftservo/ftservo-wiki
repo_url: https://github.com/ftservo/ftservo-wiki
edit_uri: edit/main/docs/

# Model pages are reached from the series catalogs. Keeping them out of the
# global sidebar avoids a large model navigation tree while retaining search.
not_in_nav: |
  products/models/**/*.md
  en/products/models/**/*.md

theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.path
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  palette:
    - scheme: default
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - scheme: slate
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式

plugins:
  - search:
      lang: [zh, en]
  - i18n:
      docs_structure: folder
      languages:
        - locale: zh
          name: 简体中文
          default: true
          build: true
          nav:
            - 首页: index.md
            - 开始使用:
                - getting-started/index.md
                - 总线舵机入门: getting-started/bus.md
                - PWM 舵机入门: getting-started/pwm.md
                - 供电与接线: getting-started/wiring.md
                - 第一次运动: getting-started/first-motion.md
            - 产品与选型:
                - products/index.md
                - 系列与接口: products/series.md
                - 型号目录:
                    - products/datasheets/index.md
                    - HD: products/datasheets/hd.md
                    - HL: products/datasheets/hl.md
                    - PWM: products/datasheets/pwm.md
                    - SC: products/datasheets/sc.md
                    - SM: products/datasheets/sm.md
                    - ST: products/datasheets/st.md
            - 程序开发:
                - sdk/index.md
                - Python: sdk/python.md
                - Arduino / ESP32: sdk/arduino.md
                - Linux / STM32 HAL: sdk/linux-stm32.md
                - FD 搜索与配置: tools/fd.md
                - 调试板与适配器: tools/adapters.md
                - 用 AI 开发: ai-development.md
            - 结构与装配:
                - mechanical/index.md
            - 协议与参数:
                - reference/index.md
                - 数据包协议: reference/protocol.md
                - SCSCL 内存表: reference/memory-scscl.md
                - SMS / STS 内存表: reference/memory-sms-sts.md
                - HLS 内存表: reference/memory-hls.md
            - 故障排查: troubleshooting.md
            - 资料下载: downloads.md
        - locale: en
          name: English
          build: true
          nav:
            - Home: index.md
            - Get Started:
                - getting-started/index.md
                - Bus servo setup: getting-started/bus.md
                - PWM servo setup: getting-started/pwm.md
                - Power and wiring: getting-started/wiring.md
                - First motion: getting-started/first-motion.md
            - Products and Selection:
                - products/index.md
                - Families and interfaces: products/series.md
                - Model Catalog:
                    - products/datasheets/index.md
                    - HD: products/datasheets/hd.md
                    - HL: products/datasheets/hl.md
                    - PWM: products/datasheets/pwm.md
                    - SC: products/datasheets/sc.md
                    - SM: products/datasheets/sm.md
                    - ST: products/datasheets/st.md
            - Software Development:
                - sdk/index.md
                - Python: sdk/python.md
                - Arduino / ESP32: sdk/arduino.md
                - Linux / STM32 HAL: sdk/linux-stm32.md
                - FD discovery and setup: tools/fd.md
                - Debug boards and adapters: tools/adapters.md
                - Develop with AI: ai-development.md
            - Mechanics and Assembly:
                - mechanical/index.md
            - Protocol and Parameters:
                - reference/index.md
                - Packet protocol: reference/protocol.md
                - SCSCL memory table: reference/memory-scscl.md
                - SMS / STS memory table: reference/memory-sms-sts.md
                - HLS memory table: reference/memory-hls.md
            - Troubleshooting: troubleshooting.md
            - Downloads: downloads.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

extra_css:
  - stylesheets/extra.css?v=79bf665764
extra_javascript:
  - javascripts/language-redirect.js?v=31c7d2eb41
  - javascripts/servo-selector-data.js?v=533591c0af
  - javascripts/servo-selector.js?v=a89d21a438
  - javascripts/developer-context.js?v=6a26876af4
  - javascripts/servo-characteristic-chart.js?v=b1088300e5
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ftservo
    - icon: material/web
      link: https://www.feetechrc.com/
copyright: Copyright &copy; FEETECH
